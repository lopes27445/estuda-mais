<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estuda+ · Administração</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0e16">
<meta name="apple-mobile-web-app-title" content="Estuda+">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{--bg:#0a0e16;--card:#121a2b;--card2:#0f1626;--line:#1e2a40;--txt:#e8eef7;--mut:#8295b3;--cyan:#2fa64a;--cyan-d:#17833a;--gold:#ffc24b;--red:#ff5b6e;--green:#43e08a;
    --surface:#0c1322;--surface2:#101a2c;--chip:#16223a}
  html.light{--bg:#f2f5f9;--card:#ffffff;--card2:#f8fafc;--line:#d8e0ea;--txt:#1a2332;--mut:#5b6b82;
    --cyan:#1b8a3e;--cyan-d:#157334;--gold:#b07604;--red:#d93a4c;--green:#1a9f5e;
    --surface:#eef3f8;--surface2:#e7ecf3;--chip:#e3e9f1}
  html.light select,html.light input,html.light textarea{background:#ffffff}
  #btn-theme{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:10px;
    width:38px;height:38px;font-size:1rem;cursor:pointer;font-family:inherit;flex:none;margin-left:auto}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,rgba(47,166,74,.10),transparent 60%),var(--bg);color:var(--txt);min-height:100%;padding:26px 16px 70px}
  .wrap{max-width:820px;margin:0 auto}
  header{display:flex;align-items:center;gap:13px;margin-bottom:6px}
  .orb{width:40px;height:40px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#bff4ff,var(--cyan) 45%,var(--cyan-d) 75%,#06222e);box-shadow:0 0 16px rgba(47,166,74,.6),inset 0 0 12px rgba(255,255,255,.4)}
  h1{font-size:1.4rem;font-weight:800}h1 span{color:var(--cyan)}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);text-decoration:none;font-size:.86rem;font-weight:700;border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:10px;margin-bottom:14px}
  .amut{color:var(--mut);font-size:.85rem;line-height:1.5}
  .arow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0}
  .arow label{font-weight:700}
  select,input,textarea{background:var(--surface);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 10px;font-family:inherit;font-size:.9rem}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--cyan)}
  .abox{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
  .abox h3{font-size:1.05rem;margin-bottom:6px}
  .abox h4{font-size:.85rem;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin:6px 0}
  #a-paste{width:100%;min-height:150px;margin:10px 0;resize:vertical}
  .abtn{background:linear-gradient(180deg,var(--cyan),var(--cyan-d));color:#04121a;border:none;border-radius:10px;padding:11px 18px;font-weight:800;cursor:pointer;font-family:inherit;font-size:.92rem}
  .abtn.pub{background:linear-gradient(180deg,var(--green),#27a866);color:#04140b;margin-top:12px;width:100%}
  .abtn.danger{background:transparent;border:1px solid var(--red);color:var(--red);margin-top:12px}
  .aitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:7px}
  .ai-row{display:flex;gap:7px;align-items:center}
  .ai-row .ai-disc{flex:1}.ai-row .ai-data{flex:none}
  .ai-del{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;width:32px;height:32px;cursor:pointer;flex:none}
  .ai-del:hover{color:var(--red);border-color:var(--red)}
  .aitem input,.aitem textarea{width:100%}
  .afield{margin-top:12px}.afield label{display:block;color:var(--mut);font-size:.8rem;font-weight:700;margin-bottom:5px}
  .afield textarea{width:100%}
  .apub-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:560px){.apub-grid{grid-template-columns:1fr}}
  .apub-row{font-size:.85rem;padding:5px 0;border-top:1px solid var(--line)}
  .restrito{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:14px;padding:22px;text-align:center;line-height:1.6;color:var(--mut)}
</style>
<script>window.LAB=true;window.MURAL_COLL="murals-lab2";window.CLOUD_PANEL={home:true,onReady:function(){ if(window._ADMIN_BOOT) window._ADMIN_BOOT(); }};</script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="app/theme.js"></script>
<script src="app/firebase-config.js"></script>
<script src="app/cloud.js"></script>
<script src="app/calparse.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script>(function(){var t=null;try{t=localStorage.getItem("educa-theme")}catch(e){};if(t==="light")document.documentElement.classList.add("light");else if(t==="dark")document.documentElement.classList.remove("light");else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.classList.add("light");})();</script>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">‹ Menu</a>
  <header><svg viewBox="0 0 64 64" style="width:38px;height:38px;flex:none" aria-hidden="true"><rect x="6" y="31" width="10" height="21" rx="3.5" fill="#8fd99b"/><rect x="19" y="23" width="10" height="29" rx="3.5" fill="#54c163"/><rect x="32" y="15" width="10" height="37" rx="3.5" fill="#2fa64a"/><path d="M8 37 L25 50 L60 9" fill="none" stroke="#0f7a30" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/></svg><div><h1>estuda<span>+</span> · Administração</h1></div>
    <button id="btn-theme" onclick="EducaTheme.toggle()" title="Alternar tema claro/escuro">☀️</button>
  </header>
  <div class="amut" style="margin-bottom:10px">Lance o calendário de provas e produções de cada série colando o comunicado da escola.</div>
  <div id="admin-root"><p class="amut">Carregando…</p></div>
</div>
<script src="app/admin.app.js"></script>
</body>
</html>
